<section class="install-prompt" data-install-prompt hidden aria-live="polite">
  <div class="install-prompt-mark" aria-hidden="true">LvL</div>
  <div class="install-prompt-copy">
    <h2 data-i18n="install_title">Install LvL</h2>
    <p data-install-message data-i18n="install_desc">Put LvL on your home screen for a faster app-like experience.</p>
    <p class="install-manual-note" data-install-manual data-i18n="install_manual" hidden>Use your browser menu and choose Install app or Add to Home Screen.</p>
    <ol class="install-ios-steps" data-install-ios data-install-manual hidden>
      <li data-i18n="install_step_share">Tap Share in Safari.</li>
      <li data-i18n="install_step_add">Choose Add to Home Screen.</li>
      <li data-i18n="install_step_open">Open LvL from the new icon.</li>
    </ol>
  </div>
  <div class="install-prompt-actions">
    <button type="button" class="primary-button" data-install-action data-i18n="install_action" hidden>Install app</button>
    <button type="button" class="outline-button" data-install-dismiss data-i18n="install_dismiss">Not now</button>
  </div>
</section>
